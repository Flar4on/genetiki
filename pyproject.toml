[project]
name = "genetiki-rns"
version = "0.1.0"
description = "Система коммуникации для расширенного неонатального скрининга РС(Я)"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13,<4",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    "pydantic-settings>=2.6,<3",
    "python-jose[cryptography]>=3.3,<4",
    "passlib[bcrypt]>=1.7,<2",
    "bcrypt==4.0.1",
    "cryptography>=44,<45",
    "redis>=5.2,<6",
    "aiohttp>=3.11,<4",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.12,<1",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
