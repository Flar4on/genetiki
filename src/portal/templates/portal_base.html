<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Личный кабинет — РНС{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background: #f0f4f8; }
        .portal-nav {
            background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
            padding: 1rem 0;
        }
        .portal-nav a { color: rgba(255,255,255,.85); text-decoration: none; }
        .portal-nav a:hover, .portal-nav a.active { color: #fff; }
        .card { border: none; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
        .status-positive { color: #dc3545; font-weight: 600; }
        .status-negative { color: #198754; font-weight: 600; }
        .status-repeat { color: #fd7e14; font-weight: 600; }
        .baby-card { border-left: 4px solid #0d6efd; }
        .screening-badge { font-size: .85rem; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="portal-nav">
        <div class="container d-flex align-items-center justify-content-between">
            <a href="/portal/" class="fs-5 fw-bold">
                <i class="bi bi-heart-pulse me-2"></i>РНС — Личный кабинет
            </a>
            <div class="d-flex gap-3 align-items-center">
                <a href="/portal/" class="{% if active_page == 'dashboard' %}active{% endif %}">
                    <i class="bi bi-house me-1"></i>Главная
                </a>
                <a href="/portal/children" class="{% if active_page == 'children' %}active{% endif %}">
                    <i class="bi bi-person-hearts me-1"></i>Мои дети
                </a>
                <a href="/portal/notifications" class="{% if active_page == 'notifications' %}active{% endif %}">
                    <i class="bi bi-bell me-1"></i>Уведомления
                </a>
                <a href="/portal/info" class="{% if active_page == 'info' %}active{% endif %}">
                    <i class="bi bi-info-circle me-1"></i>О скрининге
                </a>
                <span class="text-white-50 ms-3">{{ parent_name }}</span>
                <a href="/portal/logout" class="text-white-50">
                    <i class="bi bi-box-arrow-right"></i>
                </a>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        {% block content %}{% endblock %}
    </div>

    <footer class="text-center text-muted py-4 small">
        Медико-генетический центр РБ №1 — НЦМ, Якутск &middot;
        Горячая линия: +7 (4112) 39-45-17
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
