<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Личный кабинет НС</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card { max-width: 440px; width: 100%; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="card shadow-sm">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="bi bi-heart-pulse text-primary fs-1"></i>
                    <h4 class="fw-bold mt-2">Личный кабинет</h4>
                    <p class="text-muted">Неонатальный скрининг РС(Я)</p>
                </div>

                {% if error %}
                <div class="alert alert-danger py-2">{{ error }}</div>
                {% endif %}

                <form method="POST" action="/portal/login">
                    <div class="mb-3">
                        <label class="form-label">Номер телефона</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                            <input type="tel" name="phone" class="form-control" placeholder="+7 (___) ___-__-__" required autofocus>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Пароль</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-box-arrow-in-right me-1"></i>Войти
                    </button>
                </form>

                <hr class="my-4">
                <div class="text-muted small text-center">
                    <a href="/" class="text-muted"><i class="bi bi-arrow-left me-1"></i>На главную</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
