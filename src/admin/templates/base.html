<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}РНС Якутия{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        .sidebar {
            min-height: 100vh;
            background: #1a237e;
        }
        .sidebar .nav-link {
            color: rgba(255,255,255,.7);
            padding: .75rem 1rem;
            border-radius: .375rem;
            margin: .125rem .5rem;
        }
        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
            color: #fff;
            background: rgba(255,255,255,.1);
        }
        .stat-card {
            border-left: 4px solid;
            transition: transform .15s;
        }
        .stat-card:hover {
            transform: translateY(-2px);
        }
        .stat-card.primary { border-left-color: #1a237e; }
        .stat-card.success { border-left-color: #2e7d32; }
        .stat-card.warning { border-left-color: #f57f17; }
        .stat-card.danger { border-left-color: #c62828; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <div class="d-flex">
        {% block sidebar %}
        <nav class="sidebar d-flex flex-column p-3" style="width: 250px;">
            <a class="text-white text-decoration-none mb-4 d-flex align-items-center" href="/admin/">
                <i class="bi bi-heart-pulse me-2 fs-4"></i>
                <span class="fs-5 fw-bold">РНС Якутия</span>
            </a>
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link {% if active_page == 'dashboard' %}active{% endif %}" href="/admin/">
                        <i class="bi bi-speedometer2 me-2"></i>Дашборд
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if active_page == 'parents' %}active{% endif %}" href="/admin/parents">
                        <i class="bi bi-people me-2"></i>Родители
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if active_page == 'babies' %}active{% endif %}" href="/admin/babies">
                        <i class="bi bi-person-hearts me-2"></i>Дети
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if active_page == 'screening' %}active{% endif %}" href="/admin/screening">
                        <i class="bi bi-clipboard2-pulse me-2"></i>Скрининг
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if active_page == 'notifications' %}active{% endif %}" href="/admin/notifications">
                        <i class="bi bi-bell me-2"></i>Уведомления
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if active_page == 'analytics' %}active{% endif %}" href="/admin/analytics">
                        <i class="bi bi-bar-chart me-2"></i>Аналитика
                    </a>
                </li>
            </ul>
            <div class="mt-auto">
                <div class="text-white-50 small px-3 mb-2">
                    {{ user.full_name if user else '' }}
                </div>
                <a class="nav-link text-white-50" href="/admin/logout">
                    <i class="bi bi-box-arrow-left me-2"></i>Выйти
                </a>
            </div>
        </nav>
        {% endblock %}
        <main class="flex-grow-1 p-4 bg-light">
            {% block content %}{% endblock %}
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
