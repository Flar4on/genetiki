<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - НС Якутия</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: linear-gradient(135deg, #1a237e 0%, #283593 100%); min-height: 100vh; padding: 1rem; display: flex; align-items: center; }
        .login-card { max-width: 400px; margin: 0 auto; width: 100%; }

        @media (max-width: 480px) {
            .login-card { margin: 0 auto; }
            .login-card .card-body { padding: 1.5rem !important; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-card">
            <div class="card shadow">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <h4 class="fw-bold">НС Якутия</h4>
                        <p class="text-muted">Панель управления</p>
                    </div>
                    {% if error %}
                    <div class="alert alert-danger">{{ error }}</div>
                    {% endif %}
                    <form method="POST" action="/admin/login">
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" name="email" class="form-control" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Пароль</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Войти</button>
                    </form>
                    <hr class="my-4">
                    <div class="text-muted small text-center">
                        <a href="/" class="text-muted"><i class="bi bi-arrow-left me-1"></i>На главную</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
